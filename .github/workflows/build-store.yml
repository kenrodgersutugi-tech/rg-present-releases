# Builds the Microsoft Store package (MSIX) for the app in app/.
#
# The package comes out as an artifact on the run's summary page, and is also attached to the
# GitHub release of the same version when there is one, so it can be fetched with a plain link
# rather than a 364 MB zip. A person still uploads it to Partner Center: nothing here needs a
# certificate, because the Store signs the package itself. That is also why the attached copy is
# named "-store-unsigned": Windows will not install it by double-clicking, and the name should
# say so before somebody downloads 174 MB to find out.
#
# The identity below is the one Partner Center issued for RG-Present and must match it to the
# character, or the upload is rejected:
#   Package/Identity/Name            RgDevs.RGPresent
#   Package/Identity/Publisher       CN=25EB1C95-8AD6-410C-8573-109DE5DB2BCF
#   Package/Properties/PublisherDisplayName  Rg Devs
#   Package/Properties/DisplayName   RG Present   <- the reserved name, no hyphen. The product is
#                                    written RG-Present everywhere else; the Store will only take a
#                                    name reserved in Partner Center, and that is the one reserved.
#   Store ID                         9NQ687HLV0B2
#
# Actions -> Build Store package -> Run workflow.
name: Build Store package

on:
  workflow_dispatch:

permissions:
  # Only to attach the finished package to its release.
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  package:
    # makeappx comes from the Windows SDK, so this only builds on Windows.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Draw the icons and the Store tiles
        timeout-minutes: 6
        run: npx electron tools/make-icons.js

      - name: Build the content packs
        run: npm run build-packs

      - name: Bundle the setup guide
        run: npm run bundle-guide

      - name: Check the identity before spending a build on it
        shell: pwsh
        run: |
          $appx = (Get-Content package.json -Raw | ConvertFrom-Json).build.appx
          Write-Host "identityName        : $($appx.identityName)"
          Write-Host "publisher           : $($appx.publisher)"
          Write-Host "publisherDisplayName: $($appx.publisherDisplayName)"
          if ($appx.identityName -ne 'RgDevs.RGPresent') { throw 'identityName does not match Partner Center.' }
          if ($appx.publisher -ne 'CN=25EB1C95-8AD6-410C-8573-109DE5DB2BCF') { throw 'publisher does not match Partner Center.' }
          Write-Host "displayName         : $($appx.displayName)"
          if ($appx.displayName -ne 'RG Present') {
            throw "displayName is '$($appx.displayName)'. The Store only accepts a name reserved in Partner Center, and the reserved one is 'RG Present' — not the hyphenated product name."
          }
          Write-Host "minVersion          : $($appx.minVersion)"
          if (-not $appx.minVersion -or [version]$appx.minVersion -le [version]'10.0.17134.0') {
            throw 'build.appx.minVersion must be above 10.0.17134.0 or Partner Center refuses the upload.'
          }
          $tiles = Get-ChildItem build/appx -Filter *.png
          Write-Host "tiles               : $($tiles.Count)"
          if ($tiles.Count -lt 10) { throw 'The Store tiles were not drawn.' }

      - name: Package for the Store
        run: npx electron-builder --win appx --x64 --publish never

      - name: What is inside it
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist -Filter *.appx -Recurse | Select-Object -First 1
          if (-not $msix) { throw 'No package was produced.' }
          Copy-Item $msix.FullName "dist/RG-Present-$((Get-Content package.json -Raw | ConvertFrom-Json).version).msix"
          Write-Host ("package: {0}  {1:N0} bytes" -f $msix.Name, $msix.Length)

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $xml = [xml]$reader.ReadToEnd()
            $identity = $xml.Package.Identity
            Write-Host "Identity/Name   : $($identity.Name)"
            Write-Host "Identity/Publisher: $($identity.Publisher)"
            Write-Host "Identity/Version: $($identity.Version)"
            Write-Host "PublisherDisplayName: $($xml.Package.Properties.PublisherDisplayName)"
            Write-Host "Properties/DisplayName: $($xml.Package.Properties.DisplayName)"
            if ($xml.Package.Properties.DisplayName -ne 'RG Present') {
              throw "Properties/DisplayName is '$($xml.Package.Properties.DisplayName)'; Partner Center rejects any name not reserved there."
            }
            if ($identity.Name -ne 'RgDevs.RGPresent') { throw "The package identity is $($identity.Name), not RgDevs.RGPresent." }
            if (-not $identity.Version.EndsWith('.0')) { throw "The Store needs the fourth part of the version to be 0; it is $($identity.Version)." }

            # Partner Center refuses a package whose MinVersion is 10.0.17134.0
            # or lower, and it refuses it at upload, after the whole build has
            # been spent. Catch it here instead.
            $family = $xml.Package.Dependencies.TargetDeviceFamily
            Write-Host "TargetDeviceFamily  : $($family.Name) min $($family.MinVersion), tested to $($family.MaxVersionTested)"
            if ([version]$family.MinVersion -le [version]'10.0.17134.0') {
              throw "MinVersion is $($family.MinVersion); the Store will not take anything at or below 10.0.17134.0. Set build.appx.minVersion in package.json."
            }
            # The app must not try to update itself from a Store copy.
            $src = $zip.Entries | Where-Object { $_.FullName -like '*app/src/main/updater.js' }
            if (-not $src) { Write-Host 'updater.js is inside the asar, as expected.' }
          } finally { $zip.Dispose() }

      - name: Attach it to the release of the same version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $built = "dist/RG-Present-$version.msix"
          if (-not (Test-Path $built)) { throw "No package at $built." }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "There is no $tag release yet, so there is nothing to attach the package to."
            exit 0
          }

          # The name says what it is: the Store signs this, Windows will not install it as it is.
          $named = "dist/RG-Present-$version-store-unsigned.msix"
          Copy-Item $built $named -Force
          gh release upload $tag $named --clobber --repo $env:GITHUB_REPOSITORY
          Write-Host "Attached $named to $tag."

      - uses: actions/upload-artifact@v4
        with:
          name: RG-Present-store-package
          path: |
            app/dist/*.appx
            app/dist/*.msix
          retention-days: 90
