# Builds the Windows installer for the app in app/ and publishes it as a GitHub Release, together
# with the content packs and the updates.json that RG-Present's in-app updater reads.
#
# Publish a new version:
#   cd app && npm version 1.3.0 && cd .. && git commit -am "RG-Present 1.3.0" && git tag v1.3.0
#   git push && git push --tags
#
# Church computers read:
#   https://github.com/kenrodgersutugi-tech/rg-present-releases/releases/latest/download/updates.json
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build content packs
        run: npm run build-packs

      - name: Build icons
        run: npx electron tools/make-icons.js

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Build update feed
        run: node tools/make-update-feed.js feed --notes "${{ github.ref_name }}"

      # The download page links to a fixed file name, so publish a copy under it as well.
      - name: Copy the installer under the download page's fixed name
        shell: bash
        run: cp feed/RG-Present-Setup-*.exe feed/RG-Present-Setup.exe

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            app/feed/updates.json
            app/feed/*.exe
            app/feed/*.rgpkg
